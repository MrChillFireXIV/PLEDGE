<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>PLEDGE graphics test</title>
<style>
body{margin:0;background:#0d1322;color:#f2ead8;font:600 20px/1.45 Arial,sans-serif}
#wrap{max-width:1200px;margin:0 auto;padding:22px 26px}
h1{font-size:30px;margin:0 0 4px;color:#ffd24a}
#info{font:500 15px/1.5 monospace;opacity:.85;margin:10px 0 16px;white-space:pre-wrap}
#list{list-style:none;padding:0;margin:0}
#list li{padding:5px 12px;margin:4px 0;border-radius:8px;background:#18203a;display:flex;gap:14px;align-items:baseline}
#list li b{min-width:34px;text-align:center}
#list li span{flex:1}#list li small{opacity:.75;font:500 15px monospace}
.ok b{color:#6fe08a}.bad b{color:#ff6b6b}.run b{color:#ffd24a}
button{font:700 22px Arial;padding:12px 30px;border-radius:10px;border:0;background:#ffd24a;color:#14182c;margin:14px 12px 0 0}
button.sec{background:#2a3558;color:#f2ead8}
#stage{position:fixed;right:16px;bottom:16px;width:320px;height:160px;border:2px solid #2a3558;border-radius:8px;overflow:hidden;background:#000}
#stage canvas{width:100%!important;height:100%!important}
#msg{margin-top:12px;font-size:18px;color:#ffd24a}
</style></head><body><div id="wrap">
<h1>PLEDGE graphics test</h1>
<div>Runs each graphics check on its own. If the 3D stops, the page notes which check did it, reloads and carries on. Take a photo of the list when it says "All done".</div>
<div id="info"></div>
<ul id="list"></ul>
<div id="msg"></div>
<button id="go">Run tests</button><button id="reset" class="sec">Start over</button>
</div><div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* the checks, from simplest to the things the game does. Each one renders FR frames on a 1280x640 canvas with the game's renderer settings unless it says otherwise */
const FR=90,W=1280,H=640,GAMEOPT={antialias:false,powerPreference:'high-performance',stencil:false};
const SK='pledge.gltest';
function st(){try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s))}catch(e){}}
const KEEP=[];/* 2D canvases kept alive for the canvas checks */
function canv2d(n,w,h,opt){for(let i=0;i<n;i++){const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d',opt);q.fillStyle='hsl('+(i*37%360)+',50%,50%)';q.fillRect(0,0,w,h);q.fillStyle='#fff';q.font='20px Arial';q.fillText('PLEDGE '+i,10,30);for(let k=0;k<20;k++){q.fillStyle='rgba(0,0,0,.2)';q.fillRect((k*53)%w,(k*31)%h,w/8,h/8)}KEEP.push(c)}}
function lights(s){s.add(new THREE.HemisphereLight(0xcfe3ff,0x5a6a3a,.8));const d=new THREE.DirectionalLight(0xfff0d8,1.1);d.position.set(30,60,20);s.add(d);return d}
function boxes(s,n,matF){const g=new THREE.BoxGeometry(1,1,1);for(let i=0;i<n;i++){const m=new THREE.Mesh(g,matF(i));m.position.set((i%20)-10,Math.floor(i/20)%15-7,-12-Math.floor(i/300)*3);s.add(m)}}
const T=[
 ['Basic 3D (one cube, plain settings)',{opt:{}},s=>{lights(s);boxes(s,1,()=>new THREE.MeshLambertMaterial({color:0xd04040}))}],
 ['Basic 3D with the game\'s settings',{},s=>{lights(s);boxes(s,1,()=>new THREE.MeshLambertMaterial({color:0xd04040}))}],
 ['300 shapes, game lighting',{},s=>{lights(s);boxes(s,300,i=>new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(i/300,.5,.5)}))}],
 ['Shiny materials (MeshStandard x50)',{},s=>{lights(s);boxes(s,50,i=>new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(i/50,.5,.5),roughness:.6}))}],
 ['Big ground mesh (520k + 210k points)',{},s=>{lights(s);const a=new THREE.Mesh(new THREE.PlaneGeometry(60,60,719,719),new THREE.MeshLambertMaterial({color:0x4a8a3a}));a.rotation.x=-1.2;a.position.z=-30;s.add(a);const b=new THREE.Mesh(new THREE.PlaneGeometry(30,30,460,460),new THREE.MeshLambertMaterial({color:0x8a6a4a}));b.position.z=-25;s.add(b)}],
 ['150 picture textures (256x256)',{},s=>{lights(s);const L=[];for(let i=0;i<150;i++){const c=document.createElement('canvas');c.width=c.height=256;const q=c.getContext('2d');q.fillStyle='hsl('+i*7+',60%,50%)';q.fillRect(0,0,256,256);q.fillStyle='#fff';q.fillRect(20,20,100,100);L.push(new THREE.CanvasTexture(c))}boxes(s,150,i=>new THREE.MeshLambertMaterial({map:L[i]}))}],
 ['One large texture (1024x1024)',{},s=>{lights(s);const c=document.createElement('canvas');c.width=c.height=1024;const q=c.getContext('2d');q.fillStyle='#5a8';q.fillRect(0,0,1024,1024);const t=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshLambertMaterial({map:t}));m.position.z=-15;s.add(m)}],
 ['Shadows on (1024 shadow map)',{shadow:1},s=>{const d=lights(s);d.castShadow=true;d.shadow.mapSize.set(1024,1024);boxes(s,60,()=>new THREE.MeshLambertMaterial({color:0xcccccc}));s.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}})}],
 ['1100 small 2D canvases (like the game makes), then 3D',{pre:()=>canv2d(1100,256,256)},s=>{lights(s);boxes(s,20,()=>new THREE.MeshLambertMaterial({color:0x40a0d0}))}],
 ['Big 2D canvases (4096 + 740x3300), then 3D',{pre:()=>{canv2d(1,4096,4096);canv2d(1,740,3300)}},s=>{lights(s);boxes(s,20,()=>new THREE.MeshLambertMaterial({color:0x40d0a0}))}],
 ['Custom shader (sky style)',{},s=>{lights(s);const m=new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{t:{value:0}},vertexShader:'varying vec3 vp;void main(){vp=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 vp;uniform float t;void main(){float h=normalize(vp).y;vec3 c=mix(vec3(.8,.9,1.),vec3(.2,.4,.8),clamp(h,0.,1.));for(int i=0;i<8;i++){c+=.002*sin(vp.x*.1*float(i)+t);}gl_FragColor=vec4(c,1.);}'}));s.add(m);boxes(s,10,()=>new THREE.MeshLambertMaterial({color:0xffffff}))}],
 ['Odd height (1280x639)',{w:1280,h:639},s=>{lights(s);boxes(s,100,i=>new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(i/100,.5,.5)}))}],
 ['Odd width (1281x640)',{w:1281,h:640},s=>{lights(s);boxes(s,100,i=>new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(i/100,.5,.5)}))}],
 ['Screen size rounded to even',{full:2},s=>{lights(s);boxes(s,100,i=>new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(i/100,.5,.5)}))}],
 ['Full screen size, exact',{full:1},s=>{lights(s);boxes(s,100,i=>new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(i/100,.5,.5)}))}],
];
const $=id=>document.getElementById(id),list=$('list');
function info(){let r='?',mt='?';try{const c=document.createElement('canvas'),gl=c.getContext('webgl2')||c.getContext('webgl'),di=gl.getExtension('WEBGL_debug_renderer_info');r=di?gl.getParameter(di.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);mt=gl.getParameter(gl.MAX_TEXTURE_SIZE)+' · webgl'+(gl instanceof WebGL2RenderingContext?'2':'1');const x=gl.getExtension('WEBGL_lose_context');if(x)x.loseContext()}catch(e){r='no 3D: '+e.message}
  const pm=performance.memory;$('info').textContent='gpu '+r+'\nmax texture '+mt+' · screen '+innerWidth+'x'+innerHeight+' @'+devicePixelRatio+(navigator.deviceMemory?' · device '+navigator.deviceMemory+' GB':'')+(pm?' · js limit '+Math.round(pm.jsHeapSizeLimit/1e6)+' MB':'')+'\n'+navigator.userAgent}
function draw(){const s=st()||{i:-1,res:[]};$('stage').style.display=s.i>=0?'block':'none';list.innerHTML='';T.forEach((t,i)=>{const r=s.res[i],li=document.createElement('li');li.className=r?(r.ok?'ok':'bad'):(i===s.i?'run':'');li.innerHTML='<b>'+(r?(r.ok?'OK':'FAIL'):(i===s.i?'…':''))+'</b><span>'+(i+1)+'. '+t[0]+'</span><small>'+(r?r.note:'')+'</small>';list.appendChild(li)})}
function next(){const s=st();if(!s)return;let i=s.res.length;if(i>=T.length){s.i=-1;save(s);draw();$('msg').textContent='All done. Take a photo of this list and send it.';return}s.i=i;s.started=Date.now();save(s);draw();setTimeout(()=>runOne(i),400)}
function finish(i,ok,note){const s=st();if(!s||s.res.length!==i)return;s.res[i]={ok,note};s.i=-1;save(s);draw();
  if(!ok){$('msg').textContent='The 3D stopped on check '+(i+1)+'. Reloading to carry on…';setTimeout(()=>location.reload(),2500)}else setTimeout(next,300)}
function runOne(i){const[name,o,build]=T[i];let ren,lost=0,f=0,t0=0;const stage=$('stage');stage.innerHTML='';
  try{if(o.pre)o.pre();ren=new THREE.WebGLRenderer(Object.assign({},o.opt||GAMEOPT));}catch(e){finish(i,false,'could not start: '+e.message);return}
  let w=o.w||(o.full?Math.round(innerWidth*devicePixelRatio):W),h=o.h||(o.full?Math.round(innerHeight*devicePixelRatio):H);if(o.full===2){w&=~1;h&=~1}ren.setPixelRatio(1);ren.setSize(w,h,false);if(o.shadow)ren.shadowMap.enabled=true;stage.appendChild(ren.domElement);
  ren.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();if(lost)return;lost=1;finish(i,false,w+'x'+h+' · stopped at frame '+f)},false);
  const sc=new THREE.Scene();sc.background=new THREE.Color(0x87a8d8);const cam=new THREE.PerspectiveCamera(60,w/h,.1,400);cam.position.set(0,0,8);
  try{build(sc)}catch(e){finish(i,false,'build error: '+e.message);return}
  const step=()=>{if(lost)return;try{sc.rotation.y=f*.01;sc.traverse(x=>{if(x.material&&x.material.uniforms&&x.material.uniforms.t)x.material.uniforms.t.value=f*.05});ren.render(sc,cam)}catch(e){finish(i,false,'error: '+e.message);return}
    if(f===0)t0=performance.now();f++;if(f<FR){requestAnimationFrame(step);return}const ms=(performance.now()-t0)/(FR-1);
    try{ren.dispose()}catch(e){}stage.innerHTML='';if(!lost)finish(i,true,w+'x'+h+' · '+Math.round(1000/Math.max(1,ms))+' fps')};requestAnimationFrame(step)}
$('go').onclick=()=>{save({i:-1,res:[]});$('msg').textContent='';next()};
$('reset').onclick=()=>{try{localStorage.removeItem(SK)}catch(e){}$('msg').textContent='';draw()};
info();
/* back from a reload: a check that was running when the page went away counts as a failure, then the list carries on */
{const s=st();if(s&&s.i>=0&&!s.res[s.i]){s.res[s.i]={ok:false,note:'page crashed'};s.i=-1;save(s)}draw();if(s&&s.res.length&&s.res.length<T.length){$('msg').textContent='Carrying on…';setTimeout(next,1500)}else if(s&&s.res.length>=T.length)$('msg').textContent='All done. Take a photo of this list and send it.'}
</script></body></html>
